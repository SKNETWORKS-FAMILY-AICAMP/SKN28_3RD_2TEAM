version: 1
checked_at: '2026-06-17'
defaults:
  request_timeout_seconds: 30
  polite_delay_seconds: 0.2
  file_extensions:
  - pdf
  - hwp
  - hwpx
  - doc
  - docx
  - ppt
  - pptx
  - xls
  - xlsx
  raw_store:
    root: data/raw
  processed_store:
    root: data/processed
  vector_store:
    provider: chroma
    path: data/vector/chroma
  raw:
    file_policy:
      max_file_size_mb: 30
      exclude_url_patterns:
      - (?i)newsletter
      - (?i)magazine
      - (?i)annual
      - (?i)report
      - 소식지
      include_url_patterns: []
      skip_unknown_size: false
  processing:
    filter_policy:
      skip_duplicate_raw_sha: true
      skip_duplicate_document_text: true
      skip_duplicate_chunks: true
      min_text_chars: 200
      min_text_chars_by_type:
        html: 200
        rendered_html: 200
        html_shell: 300
        spa_bundle_text: 200
        google_sheet: 80
        news: 100
        faculty: 50
        pdf: 80
      exclude_document_types:
      - html_shell
      - google_sheet
      - spa_bundle_text
      max_pdf_size_mb: 30
      exclude_pdf_url_patterns:
      - (?i)newsletter
      - (?i)magazine
      - (?i)annual
      - (?i)report
      - 소식지
      exclude_asset_url_patterns:
      - (?i)/vendor
      - (?i)vendor-
      - (?i)chunk-vendors
      include_html_url_patterns: []
      exclude_html_url_patterns: []
